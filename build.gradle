plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// Single source of truth for the shipped version is `version=` in
// gradle.properties, the file the release gate reads. A release workflow may
// override it with `-Pmod_version=<version>`.
def modVersion = (findProperty("mod_version") ?: project.version) as String
version = modVersion

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    // dynamic-vehicles is not on a maven repository; fetched from its GitHub release, pinned by
    // version and verified by sha512, same pattern dynamic-vehicles itself uses for
    // dynamic-terrain. compileOnly ONLY below (never runtimeOnly): this is strictly an optional
    // dependency (neoforge.mods.toml), resolved at compile time only so ContractWaypointOverlay's
    // ModList-guarded integration code can reference its classes. Putting it on the runtime
    // classpath too would make NeoForge try to load it as an actual mod -- which (confirmed by
    // CI) fails outright here, since dynamic-vehicles itself requires a licensed physics
    // companion and a separate terrain mod that aren't present in this build.
    mavenCentral()
}

def dynamicVehiclesJar = layout.buildDirectory.file("dynamicvehicles/dynamicvehicles-${project.dynamicvehicles_version}.jar")
def dynamicVehiclesVersion = project.dynamicvehicles_version
def dynamicVehiclesSha512 = project.dynamicvehicles_sha512
tasks.register("downloadDynamicVehicles") {
    outputs.file(dynamicVehiclesJar)
    doLast {
        def target = dynamicVehiclesJar.get().asFile
        target.parentFile.mkdirs()
        def url = "https://github.com/brooswit-minecraft/dynamic-vehicles/releases/download/v${dynamicVehiclesVersion}/dynamicvehicles-${dynamicVehiclesVersion}.jar"
        new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance("SHA-512")
        def actual = digest.digest(target.bytes).encodeHex().toString()
        if (actual != dynamicVehiclesSha512) {
            target.delete()
            throw new GradleException("dynamic-vehicles ${dynamicVehiclesVersion} sha512 mismatch: ${actual}")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // NeoForge selects a @GameTest by its EFFECTIVE namespace: the enclosing @GameTestHolder's
    // namespace, UNLESS a test's own templateNamespace overrides it -- that override changes which
    // namespace the test is selected under too, not just where its structure is looked up.
    // DispatcherGameTests/SettlementFounderGameTests/UpgradeCompatibilityGameTests all set
    // templateNamespace = "dynamicvehicles" (the structures kept that legacy namespace for save
    // compat), so "dynamicvehicles" must be enabled here too or every one of them is silently
    // filtered out before registration -- not a classloading or compile issue, confirmed by
    // MINECRAFT-493 review (comment 52318) after this repo's own build.gradle shipped with only
    // project.mod_id enabled and every GameTest run reported zero discovered tests.
    def gameTestNamespaces = "${project.mod_id},dynamicvehicles"

    runs {
        client {
            client()
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay'))
            }
            if (project.hasProperty('quickPlayMp')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlayMp'))
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly files(dynamicVehiclesJar).builtBy(tasks.named("downloadDynamicVehicles"))
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// Expands `${mod_version}` and friends in neoforge.mods.toml to the values
// computed above, so the jar's file name and the version baked into the
// built jar's mods.toml can never drift apart.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
