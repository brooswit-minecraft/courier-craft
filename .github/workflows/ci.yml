name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Gradle reports BUILD SUCCESSFUL even when the GameTest server fails to start, discovers
      # zero tests (confirmed happening here before the build.gradle fix: NeoForge selects a
      # @GameTest by its EFFECTIVE namespace, which an explicit templateNamespace overrides, not
      # just the enclosing @GameTestHolder's -- MINECRAFT-493 review comments 52318/52321), or
      # ran only unrelated tests, so a green exit code proves nothing on its own. Fail closed: the
      # server must not have failed to start, there must be no reported required-test failures,
      # at least one required test must have completed and passed, and both of this mod's named
      # upgrade-compatibility tests specifically must appear as having run.
      - name: Run GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: courier-craft
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'
