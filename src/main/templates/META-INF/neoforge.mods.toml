modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="brooswit"
description='''Dispatcher-driven delivery contracts, extracted from Dynamic Vehicles into their own NeoForge mod.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional, CLIENT only -- never required: this mod runs fully standalone without it. When
# Dynamic Vehicles is ALSO installed, the Dispatcher HUD/waypoint overlay (dispatcher/
# ContractWaypointOverlay) detects it at runtime and delegates to its real mission-waypoint
# coexistence kernel instead of this mod's own standalone copy, so Dispatcher's and Pathfinder's
# markers keep coordinating overlap avoidance exactly as before this mod existed -- MINECRAFT-493
# review (comments 52304, 52318, 52320).
[[dependencies.${mod_id}]]
    modId="dynamicvehicles"
    type="optional"
    versionRange="[0.82.0,)"
    ordering="AFTER"
    side="CLIENT"
